spring:
  application:
    name: tradeflow

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tradeflow}
    username: ${DB_USERNAME:tradeflow}
    password: ${DB_PASSWORD:tradeflow}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: when_authorized

server:
  port: 8080